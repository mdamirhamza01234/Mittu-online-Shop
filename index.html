<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4bdf6">
<title>Mittu Online Shop</title>
<style>
:root{--lav:#e4bdf6;--lav2:#f2dffb;--blue:#0a5db0;--red:#e2262d;--ink:#1c1b1f;--mut:#6b6b73;--line:#e6e3ea;--bg:#f6f4f8;--green:#1a9b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari','Nirmala UI',sans-serif;color:var(--ink);background:#e9e6ee}
#app{max-width:720px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:150px;position:relative}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{background:linear-gradient(180deg,var(--lav),var(--lav2));padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start}
.top small{font-size:13px;color:#3a3340}
.top h1{margin:2px 0 0;font-size:25px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
.top .sub{font-size:13.5px;color:#4a4350;margin-top:3px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#3a3340;margin-top:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.live.on i{background:var(--green);box-shadow:0 0 0 3px rgba(26,155,75,.2)}
.cartbtn{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
.badge.show{display:flex}
.sticky{position:sticky;top:0;z-index:20;background:var(--lav2)}
.search{padding:10px 16px 8px}
.search label{display:flex;align-items:center;gap:10px;background:#fff;border-radius:26px;height:48px;padding:0 16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:transparent;min-width:0}
.tabs{display:flex;overflow-x:auto;gap:4px;padding:2px 8px 0;scrollbar-width:none;background:var(--lav2)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px 8px;font-size:13px;color:#2a2530;border-bottom:3px solid transparent;white-space:nowrap}
.tab .ti{font-size:22px;line-height:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.7)}
.tab.on{border-bottom-color:#111;font-weight:700}
.banners{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:14px 12px 6px;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.bn{flex:0 0 88%;scroll-snap-align:center;border-radius:16px;min-height:150px;padding:20px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;color:#fff;text-align:left}
.bn b{font-size:24px;line-height:1.15;font-weight:800;max-width:70%}
.bn span{font-size:13.5px;margin-top:8px;max-width:68%;opacity:.95}
.bn em{position:absolute;right:12px;bottom:6px;font-size:84px;font-style:normal;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.sec{padding:14px 12px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 12px}
.sh h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.lnk{color:var(--blue);font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;min-width:0}
.card.off .pic{opacity:.55}
.pic{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(40px,12vw,64px);overflow:hidden;padding-bottom:26px;text-align:center}
.pic img{width:100%;height:100%;object-fit:contain;padding:6px}
.strip{position:absolute;left:0;right:0;bottom:0;height:30px;background:#efeff2;display:flex;align-items:center;padding:0 6px}
.chip{font-size:11px;color:#444;background:transparent;border:0;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;padding:0}
select.chip{appearance:none;-webkit-appearance:none;outline:0;font-weight:700;color:#222;background:#fff;border-radius:8px;padding:2px 4px;max-width:56%}
.pw{position:relative}.act{position:absolute;right:-2px;bottom:-14px;z-index:2}
.add{width:70px;height:34px;border-radius:10px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:14.5px;letter-spacing:.3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.add.dis{border-color:#bbb;color:#999}
.step{display:flex;align-items:center;justify-content:space-between;width:80px;height:34px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}
.step button{width:28px;height:34px;font-size:19px;color:#fff;line-height:1}
.step span{font-size:14.5px}
.soonpill{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 9px;border-radius:9px;background:#f1eef5;border:1px solid #d9d3e0;color:#6b6475;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}.card.soonc .pic{opacity:.8}.card.soonc .nm{color:#55505c}.oos{display:inline-block;background:#fff;border:1px solid #cfcfd6;color:#888;border-radius:8px;font-size:10.5px;padding:3px 6px;font-weight:700}
.price{font-weight:800;font-size:19px;margin-top:22px}
.soon{font-size:12px;color:var(--mut);font-weight:600}
.nm{font-size:12.5px;line-height:1.3;color:#26242b;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hi{font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{padding:16px 16px 0}
.pg h2{margin:0 0 12px;font-size:22px}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;padding:14px 12px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;text-align:center;font-weight:600}
.ctile .ci{width:100%;aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,11vw,58px)}
.ctile small{font-weight:400;color:var(--mut);font-size:11px}
.empty{padding:50px 24px;text-align:center;color:var(--mut)}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.note{margin:12px 12px 0;background:#fff7e0;border:1px solid #f1d98a;color:#6b5400;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:700px;background:#f4f1f6;border-radius:30px;box-shadow:0 2px 14px rgba(0,0,0,.18);display:flex;justify-content:space-around;padding:6px;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;padding:7px 0;border-radius:24px;color:#333;position:relative}
.nav button span.i{font-size:22px;line-height:1.1}
.nav button.on{background:#e6e1ea;font-weight:700;color:var(--red)}
.nav .badge{top:2px;right:calc(50% - 26px)}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 72px);width:calc(100% - 20px);max-width:700px;background:var(--blue);color:#fff;border-radius:16px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:29;font-weight:700;box-shadow:0 4px 14px rgba(10,93,176,.4)}
.cbar.show{display:flex}
.cbar small{display:block;font-weight:500;opacity:.9;font-size:12px}
.page{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;background:#fff;z-index:60;overflow:auto;display:none;padding-bottom:40px}
.page.show{display:block}
.ph{position:sticky;top:0;background:var(--lav);display:flex;align-items:center;gap:8px;padding:12px 8px;z-index:2}
.ph h2{margin:0;font-size:19px}
.ph button{font-size:26px;width:40px;height:40px;border-radius:50%}
.line{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.line .lp{width:58px;height:58px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none;overflow:hidden}
.line .lp img{width:100%;height:100%;object-fit:contain}
.line .li{flex:1;min-width:0}
.line .li b{font-size:14px;display:block;line-height:1.25}
.line .li small{color:var(--mut);font-size:12px}
.line .lr{text-align:right;flex:none}
.line .lr .step{margin-left:auto;margin-bottom:6px}
.line .lr div{font-weight:800}
.line.bad{opacity:.55}
.tot{padding:16px;display:flex;justify-content:space-between;font-size:18px;font-weight:800}
.btn{display:block;width:calc(100% - 32px);margin:8px 16px;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.form{padding:8px 16px}
.form label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px;font-weight:600}
.form input,.form textarea{width:100%;border:1.5px solid #d6d2dc;border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:0;background:#fff}
.form input:focus,.form textarea:focus{border-color:var(--blue)}
.pay{display:flex;gap:10px;margin-top:4px}
.pay label{flex:1;margin:0;border:1.5px solid #d6d2dc;border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.pay input{width:auto}
.err{color:var(--red);font-size:13px;margin:10px 16px 0;min-height:18px}
.ok{padding:60px 24px;text-align:center}
.ok .tick{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.ok h2{margin:0 0 8px}
.ok .oid{display:inline-block;margin:12px 0;background:var(--bg);border-radius:10px;padding:8px 16px;font-weight:800;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:28px 16px 6px}

@media(min-width:900px){
body{background:linear-gradient(180deg,#e4bdf6 0,#f6eefb 340px,#f6f4f8 100%)}
#app{max-width:1240px;box-shadow:0 0 30px rgba(60,20,90,.12);padding-bottom:130px}
.top{padding:20px 32px 6px}.top h1{font-size:34px}.top .sub{font-size:15px}
.cartbtn{width:54px;height:54px;font-size:26px}
.search{padding:12px 32px 10px;max-width:760px}
.tabs{padding:2px 24px 0;justify-content:flex-start}
.tab{font-size:14.5px;padding:8px 16px 10px}.tab .ti{width:42px;height:42px;font-size:26px}
.banners{padding:20px 28px 8px;gap:18px;overflow:visible}
.bn{flex:1 1 0;min-height:200px;padding:28px 32px;border-radius:20px}
.bn b{font-size:30px}.bn span{font-size:16px}.bn em{font-size:110px}
.sec{padding:20px 28px 0}.sh h2{font-size:26px}
.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 18px}
.nm{font-size:14px}.price{font-size:21px}.chip{font-size:12px}
.cgrid{grid-template-columns:repeat(6,minmax(0,1fr));padding:20px 28px;gap:22px 16px}
.note{margin:14px 28px 0;font-size:14px}
.foot{font-size:13px;padding:40px 16px 10px}
.nav{max-width:560px}.cbar{max-width:560px}
.page{max-width:620px;left:auto;right:0;transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
body:has(.page.show)::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
}
@media(min-width:1400px){.grid,.cgrid{grid-template-columns:repeat(7,minmax(0,1fr))}#app{max-width:1400px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div>
      <small>Online order</small>
      <h1>Mittu Wholesaler</h1>
      <div class="sub">Naugachia &amp; Kursela ke liye</div>
      <div class="live" id="live"><i></i><span>Connecting…</span></div>
    </div>
    <button class="cartbtn" data-go="cart" aria-label="Cart">🛒<span class="badge" id="b1">0</span></button>
  </div>
  <div class="sticky">
    <div class="search"><label><span>🔍</span><input id="q" type="search" placeholder="Search karein: atta, tel, sabun…" autocomplete="off"></label></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="main"></div>
  <div class="foot">Mittu Wholesaler &amp; Retailer · Daam dukaan ke live stock se</div>
</div>

<div class="cbar" id="cbar" data-go="cart"><div><span id="cbn">0 items</span><small>View cart</small></div><div id="cbt">₹0 ›</div></div>
<nav class="nav" id="nav">
  <button data-view="home" class="on"><span class="i">🏠</span>Home</button>
  <button data-view="cats"><span class="i">🗂️</span>Categories</button>
  <button data-view="again"><span class="i">🔁</span>Buy Again</button>
  <button data-go="cart"><span class="i">🛒</span>Cart<span class="badge" id="b2">0</span></button>
</nav>

<div class="page" id="pCart">
  <div class="ph"><button data-back aria-label="Back">←</button><h2>Aapka Cart</h2></div>
  <div id="cartBody"></div>
</div>
<div class="page" id="pCo">
  <div class="ph"><button data-back="cart" aria-label="Back">←</button><h2>Delivery Details</h2></div>
  <div class="form">
    <label for="fName">Aapka naam</label><input id="fName" autocomplete="name" maxlength="60">
    <label for="fPhone">Mobile number (10 digit)</label><input id="fPhone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10">
    <label for="fAddr">Pura pata (gaon / mohalla / landmark)</label><textarea id="fAddr" rows="3" maxlength="250" autocomplete="street-address"></textarea>
    <label for="fNote">Dukaandar ke liye note (optional)</label><input id="fNote" maxlength="120">
    <label>Payment</label>
    <div class="pay"><label><input type="radio" name="pay" value="COD" checked> Cash on delivery</label><label><input type="radio" name="pay" value="UPI"> UPI (delivery par)</label></div>
  </div>
  <div class="err" id="coErr"></div>
  <div class="tot"><span>Total</span><span id="coTot">₹0</span></div>
  <button class="btn" id="placeBtn">Order Karein</button>
</div>
<div class="page" id="pOk">
  <div class="ok"><div class="tick">✓</div><h2>Order mil gaya!</h2>
  <div>Aapka order dukaan tak pahunch gaya hai.</div><div class="oid" id="okId"></div>
  <div style="color:var(--mut);font-size:14px">Dukaan se aapko confirmation call aayega.</div></div>
  <button class="btn" id="okBtn">Aur kharidari karein</button>
</div>
<div class="toast" id="toast"></div>

function bestMatch(name){
  const t=toks(name);if(!t.size)return null;let best=null,bs=0;
  for(const x of CATTOK){if(!x.t.size)continue;let sh=0,w=0;
    t.forEach(k=>{if(x.t.has(k)){sh++;w+=1/Math.log(2+(TOKDF.get(k)||1))}});
    if(!sh)continue;
    const cov=sh/Math.min(t.size,x.t.size),jac=sh/(t.size+x.t.size-sh);
    const sc=jac*0.6+cov*0.4+w*0.05;
    if(sc>bs){bs=sc;best=x.c}}
  return best?{c:best,sc:bs}:null;
}
function basisLabel(b){b=String(b||'').replace(/^per\s+/i,'').trim();if(!b)return '1 pack';return /^\d/.test(b)?b:'1 '+b}

function emojiFor(name,cat){for(const [r,e] of EM){if(r.test(name))return e}return cat.e}
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round(n*100)/100;return Number.isInteger(n)?String(n):n.toFixed(2)};
const inr=n=>'₹'+fmt(n);
const uLabel=u=>{u=String(u||'').trim();if(!u)return '1 pcs';return /^\d/.test(u)?u:'1 '+u};
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
/* ---------- state ---------- */
let items=[],byId=new Map(),isLive=false;
let liveRaw=load('mittu_shop_live',null);
let cart=load('mittu_shop_cart',{});
let hist=load('mittu_shop_orders',[]);
const sel={};
let S={view:'home',cat:'all',q:''};
function rebuild(){
  const raw=liveRaw&&typeof liveRaw==='object'&&Object.keys(liveRaw).length?liveRaw:null;
  isLive=!!raw;
  const live=[];
  if(raw)Object.entries(raw).forEach(([id,o])=>{
    if(!o||!o.n)return;
    const vv=Array.isArray(o.v)?o.v:Object.values(o.v||{});
    const v=vv.map(x=>({p:Number(x&&x.p)||0,u:String((x&&x.u)||'')})).filter(x=>x.p>0);
    if(!v.length)return;
    const m=bestMatch(String(o.n));
    live.push({id,name:String(o.n),hindi:o.h?String(o.h):'',v,s:!(o.s===0||o.s===false),img:(typeof o.i==='string'&&/^https:\/\//.test(o.i))?o.i:'',live:true,m:(m&&m.sc>=0.42)?m:null,fb:m});
  });
  /* ek catalogue item ko sabse achha stock item milta hai; baaki stock items apni category mein alag dikhte hain */
  const take=new Map();
  live.forEach(it=>{if(it.m){const k=it.m.c.n,cur=take.get(k);if(!cur||it.m.sc>cur.m.sc)take.set(k,it)}});
  items=[];
  live.forEach(it=>{
    const won=it.m&&take.get(it.m.c.n)===it;
    const ref=it.m?it.m.c:(it.fb?it.fb.c:null);
    it.cat=ref?ref.cat:'c52';it.ord=ref?ref.n+(won?0:0.5):2000;it.basis='';items.push(it);
  });
  CATALOG.forEach(c=>{if(!take.has(c.n))items.push({id:'c'+c.n,name:c.name,hindi:'',v:[],s:true,img:'',cat:c.cat,ord:c.n,live:false,basis:c.basis})});
  items.sort((a,b)=>(b.live-a.live)||(a.ord-b.ord)||a.name.localeCompare(b.name));
  byId=new Map(items.map(i=>[i.id,i]));
}
/* ---------- rendering ---------- */
const ckey=(id,u)=>id+'|'+u;
function qtyOf(it,v){const c=cart[ckey(it.id,v.u)];return c?c.q:0}
function actHTML(it){
  const vi=Math.min(sel[it.id]||0,Math.max(it.v.length-1,0));const v=it.v[vi];
  if(!it.live||!v)return '<span class="soonpill">Coming soon</span>';
  if(!it.s)return '<span class="oos">Out of stock</span>';
  const q=qtyOf(it,v);
  if(!q)return `<button class="add" data-add="${esc(it.id)}" data-vi="${vi}">ADD</button>`;
  return `<div class="step"><button data-minus="${esc(it.id)}" data-vi="${vi}" aria-label="Kam karein">−</button><span>${q}</span><button data-plus="${esc(it.id)}" data-vi="${vi}" aria-label="Badhayein">+</button></div>`;
}
function cardHTML(it){
  const cat=CATMAP[it.cat]||CATS[CATS.length-1];
  const vi=Math.min(sel[it.id]||0,Math.max(it.v.length-1,0));const v=it.v[vi];
  const em=emojiFor(it.name,cat);
  const pic=it.img?`<img loading="lazy" src="${esc(it.img)}" alt="" onerror="this.replaceWith(document.createTextNode('${em}'))">`:em;
  let chip;
  if(!it.live)chip=`<span class="chip" style="max-width:58%">${esc(basisLabel(it.basis))}</span>`;
  else if(it.v.length>1)chip=`<select class="chip" data-vsel="${esc(it.id)}" aria-label="Unit">${it.v.map((x,i)=>`<option value="${i}"${i===vi?' selected':''}>${esc(uLabel(x.u))}</option>`).join('')}</select>`;
  else chip=`<span class="chip">${esc(uLabel(v.u))}</span>`;
  const price=v?`<div class="price">${inr(v.p)}</div>`:'<div class="price" style="visibility:hidden">₹0</div>';
  return `<div class="card${it.s?'':' off'}${it.live?'':' soonc'}" data-card="${esc(it.id)}"><div class="pw"><div class="pic" style="background:${cat.bg}">${pic}<div class="strip">${chip}</div></div><div class="act">${actHTML(it)}</div></div>${price}<div class="nm">${esc(it.name)}</div>${it.hindi?`<div class="hi">${esc(it.hindi)}</div>`:''}</div>`;
}
function repaint(id){
  const it=byId.get(id);if(!it)return;
  document.querySelectorAll('[data-card="'+CSS.escape(id)+'"]').forEach(el=>{const t=document.createElement('div');t.innerHTML=cardHTML(it);el.replaceWith(t.firstChild)});
}
function catItems(c){return items.filter(i=>i.cat===c)}
function usedCats(){return CATS.filter(c=>catItems(c.id).length)}
function renderTabs(){
  const cs=usedCats();
  $('#tabs').innerHTML=`<button class="tab${S.cat==='all'?' on':''}" data-cat="all"><span class="ti">🏠</span>Sab</button>`+cs.map(c=>`<button class="tab${S.cat===c.id?' on':''}" data-cat="${c.id}"><span class="ti">${c.e}</span>${esc(c.n)}</button>`).join('');
}
const BANNERS=[
 {t:'Poora Kirana, Ek Jagah',s:'Atta, dal, tel, masale — sab kuch mobile se order karein',e:'🛒',g:'linear-gradient(135deg,#7b3fe4,#d65db1)',c:'c0'},
 {t:'Dry Fruits & Mewa',s:'Badam, kaju, pista aur rozana ke masale',e:'🥜',g:'linear-gradient(135deg,#f08a24,#e2492d)',c:'c10'},
 {t:'Safai & Personal Care',s:'Sabun, shampoo, toothpaste aur ghar ki safai',e:'🧼',g:'linear-gradient(135deg,#0f9aa8,#2f6fd6)',c:'c13'}
];
function sec(c,list,all){return `<section class="sec"><div class="sh"><h2>${c.e} ${esc(c.n)}</h2>${all?`<button class="lnk" data-cat="${c.id}">Sab dekhein ›</button>`:''}</div><div class="grid">${list.map(cardHTML).join('')}</div></section>`}
function render(){
  renderTabs();
  const m=$('#main');let h='';
  const q=S.q.trim().toLowerCase();
  if(q){
    const ws=q.split(/\s+/);
    const r=items.filter(i=>{const s=(i.name+' '+i.hindi).toLowerCase();return ws.every(w=>s.includes(w))});
    h=r.length?`<section class="sec"><div class="sh"><h2>"${esc(S.q.trim())}" ke natije</h2></div><div class="grid">${r.map(cardHTML).join('')}</div></section>`:'<div class="empty"><b>🔍</b>Kuch nahi mila. Doosra naam try karein.</div>';
  }else if(S.view==='cats'){
    h='<div class="pg"><h2>Categories</h2></div><div class="cgrid">'+usedCats().map(c=>`<button class="ctile" data-cat="${c.id}" data-view="home"><span class="ci" style="background:${c.bg}">${c.e}</span>${esc(c.n)}<small>${catItems(c.id).length} items</small></button>`).join('')+'</div>';
  }else if(S.view==='again'){
    const seen=new Map();hist.slice().reverse().forEach(o=>o.items.forEach(x=>{if(!seen.has(x.id)&&byId.has(x.id))seen.set(x.id,byId.get(x.id))}));
    const l=[...seen.values()];
    h=l.length?`<section class="sec"><div class="sh"><h2>🔁 Dobara kharidein</h2></div><div class="grid">${l.map(cardHTML).join('')}</div></section>`:'<div class="empty"><b>🧺</b>Abhi koi purana order nahi hai.<br>Pehla order karte hi saman yahan dikhega.</div>';
  }else if(S.cat==='all'){
    h=(isLive?'':'<div class="note">⏳ Dukaan ka stock aur daam abhi update ho rahe hain. Thodi der baad dobara dekhein — tab tak saman ki list dekh sakte hain.</div>');
    h+='<div class="banners" id="bn">'+BANNERS.map(b=>`<button class="bn" style="background:${b.g}" data-cat="${b.c}"><b>${esc(b.t)}</b><span>${esc(b.s)}</span><em>${b.e}</em></button>`).join('')+'</div>';
    usedCats().forEach(c=>{h+=sec(c,catItems(c.id).slice(0,6),catItems(c.id).length>6)});
  }else{
    const c=CATMAP[S.cat];h=c?sec(c,catItems(c.id),false):'';
  }
  m.innerHTML=h;
  document.querySelectorAll('#nav [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view&&!q));
  bars();
}
function bars(){
  const L=lines().filter(l=>l.ok);const n=L.reduce((a,l)=>a+l.q,0),t=L.reduce((a,l)=>a+l.q*l.p,0);
  ['b1','b2'].forEach(i=>{const b=$('#'+i);b.textContent=n;b.classList.toggle('show',n>0)});
  $('#cbar').classList.toggle('show',n>0);$('#cbn').textContent=n+(n===1?' item':' items');$('#cbt').textContent=inr(t)+' ›';
}
/* ---------- cart ---------- */
function lines(){
  return Object.values(cart).map(c=>{
    const it=byId.get(c.id);const vi=it?it.v.findIndex(x=>x.u===c.u):-1;
    const ok=!!(it&&it.s&&vi>=0);
    return {c,it,vi,ok,p:ok?it.v[vi].p:0,q:c.q,u:c.u};
  });
}
function setQty(id,vi,d){
  const it=byId.get(id);if(!it||!it.v[vi])return;
  const u=it.v[vi].u,k=ckey(id,u);const cur=cart[k]?cart[k].q:0;const q=Math.max(0,Math.min(99,cur+d));
  if(q===0)delete cart[k];else cart[k]={id,u,q,name:it.name,hindi:it.hindi};
  save('mittu_shop_cart',cart);repaint(id);bars();if($('#pCart').classList.contains('show'))renderCart();
}
function renderCart(){
  const L=lines();const B=$('#cartBody');
  if(!L.length){B.innerHTML='<div class="empty"><b>🛒</b>Cart khaali hai.<br>Saman chun kar ADD dabayein.</div><button class="btn ghost" data-back>Saman dekhein</button>';return}
  let tot=0;
  let h=L.map(l=>{
    const name=l.it?l.it.name:l.c.name;const cat=CATMAP[(l.it&&l.it.cat)||'c52']||CATS[CATS.length-1];
    const em=emojiFor(name,cat);const pic=l.it&&l.it.img?`<img src="${esc(l.it.img)}" alt="" onerror="this.replaceWith(document.createTextNode('${em}'))">`:em;
    if(l.ok)tot+=l.p*l.q;
    const key=esc(l.c.id),vi=l.vi;
    return `<div class="line${l.ok?'':' bad'}"><div class="lp" style="background:${cat.bg}">${pic}</div><div class="li"><b>${esc(name)}</b><small>${esc(uLabel(l.u))}${l.ok?' · '+inr(l.p):''}</small>${l.ok?'':'<small style="color:#c0392b;display:block">Abhi available nahi</small>'}</div><div class="lr">${l.ok?`<div class="step"><button data-minus="${key}" data-vi="${vi}">−</button><span>${l.q}</span><button data-plus="${key}" data-vi="${vi}">+</button></div><div>${inr(l.p*l.q)}</div>`:`<button class="lnk" data-rm="${esc(ckey(l.c.id,l.u))}">Hatayein</button>`}</div></div>`;
  }).join('');
  h+=`<div class="tot"><span>Total</span><span>${inr(tot)}</span></div><button class="btn" id="goCo"${tot>0?'':' disabled'}>Aage badhein</button>`;
  B.innerHTML=h;
}
function openPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));if(id)$(id).classList.add('show');document.body.style.overflow=id?'hidden':''}
function openCart(){renderCart();openPage('#pCart')}
function openCo(){
  const t=lines().filter(l=>l.ok).reduce((a,l)=>a+l.p*l.q,0);if(!t){toast('Cart mein saman chunein');return}
  const p=load('mittu_shop_profile',{});$('#fName').value=p.name||'';$('#fPhone').value=p.phone||'';$('#fAddr').value=p.addr||'';
  $('#coTot').textContent=inr(t);$('#coErr').textContent='';openPage('#pCo');
}
/* ---------- order ---------- */
let FB=null;
function newId(){return 'MS'+Date.now().toString(36).slice(-6).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase()}
async function placeOrder(){
  const name=$('#fName').value.trim(),phone=$('#fPhone').value.replace(/\D/g,''),addr=$('#fAddr').value.trim(),note=$('#fNote').value.trim();
  const pay=(document.querySelector('input[name=pay]:checked')||{}).value||'COD';const err=$('#coErr');
  if(name.length<2){err.textContent='Apna naam likhein.';return}
  if(!/^[6-9]\d{9}$/.test(phone)){err.textContent='Sahi 10 digit mobile number likhein.';return}
  if(addr.length<8){err.textContent='Pura pata likhein (gaon / mohalla / landmark).';return}
  const L=lines().filter(l=>l.ok);if(!L.length){err.textContent='Cart khaali hai.';return}
  const total=Math.round(L.reduce((a,l)=>a+l.p*l.q,0)*100)/100;
  const order={id:newId(),name,phone,address:addr,note,pay,items:L.map(l=>({id:l.it.id,name:l.it.name,hindi:l.it.hindi||'',unit:l.u,price:l.p,qty:l.q,total:Math.round(l.p*l.q*100)/100})),total,status:'new',ts:Date.now(),src:'shop'};
  const btn=$('#placeBtn');btn.disabled=true;btn.textContent='Bhej rahe hain…';err.textContent='';
  try{
    if(!FB)throw new Error('offline');
    await Promise.race([FB.set(FB.push(FB.ref(FB.db,'shopOrders')),order),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),15000))]);
    save('mittu_shop_profile',{name,phone,addr});
    hist.push({id:order.id,ts:order.ts,total,items:order.items.map(i=>({id:i.id,name:i.name}))});hist=hist.slice(-30);save('mittu_shop_orders',hist);
    cart={};save('mittu_shop_cart',cart);$('#okId').textContent='Order no: '+order.id;
    openPage('#pOk');render();
  }catch(e){err.textContent='Order nahi ja paya. Internet check karke dobara koshish karein.'}
  btn.disabled=false;btn.textContent='Order Karein';
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go],[data-cat]');if(!t)return;
  if(t.dataset.add!==undefined){setQty(t.dataset.add,+t.dataset.vi,1);return}
  if(t.dataset.plus!==undefined){setQty(t.dataset.plus,+t.dataset.vi,1);return}
  if(t.dataset.minus!==undefined){setQty(t.dataset.minus,+t.dataset.vi,-1);return}
  if(t.dataset.rm!==undefined){delete cart[t.dataset.rm];save('mittu_shop_cart',cart);renderCart();bars();return}
  if(t.dataset.go==='cart'){openCart();return}
  if(t.dataset.back!==undefined){if(t.dataset.back==='cart')openCart();else openPage(null);return}
  if(t.id==='goCo'){openCo();return}
  if(t.id==='placeBtn'){placeOrder();return}
  if(t.id==='okBtn'){openPage(null);S={view:'home',cat:'all',q:''};$('#q').value='';render();window.scrollTo(0,0);return}
  if(t.dataset.cat!==undefined){S.cat=t.dataset.cat;S.view=t.dataset.view||'home';S.q='';$('#q').value='';render();window.scrollTo(0,0);return}
  if(t.dataset.view&&t.closest('#nav')){S.view=t.dataset.view;S.cat='all';S.q='';$('#q').value='';render();window.scrollTo(0,0);return}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-vsel]');if(s){sel[s.dataset.vsel]=+s.value;repaint(s.dataset.vsel)}});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value;render()},180)});
setInterval(()=>{const b=$('#bn');if(!b||document.hidden)return;const w=b.firstElementChild?b.firstElementChild.offsetWidth+10:0;if(!w)return;b.scrollTo({left:(b.scrollLeft+w>b.scrollWidth-w/2)?0:b.scrollLeft+w,behavior:'smooth'})},4500);
/* ---------- Firebase (live stock) ---------- */
function setLiveUI(on){const l=$('#live');l.classList.toggle('on',on);l.querySelector('span').textContent=on?'Live daam · dukaan ke stock se':'Offline — pichhle daam dikh rahe hain'}
async function initFB(){
  try{
    const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const D=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
    const app=A.initializeApp({apiKey:"AIzaSyDQ-fm6-_bs728n6rcUS-XS9Zl-hqbIQhA",authDomain:"mittu-billing.firebaseapp.com",databaseURL:"https://mittu-billing-default-rtdb.firebaseio.com",projectId:"mittu-billing",storageBucket:"mittu-billing.firebasestorage.app",messagingSenderId:"9778174452",appId:"1:9778174452:web:99b40c599546a5560541a1"});
    const db=D.getDatabase(app);FB={db,ref:D.ref,set:D.set,push:D.push};
    D.onValue(D.ref(db,'.info/connected'),s=>setLiveUI(!!s.val()));
    D.onValue(D.ref(db,'publicShop/stock'),s=>{liveRaw=s.val();save('mittu_shop_live',liveRaw);rebuild();render();if(!s.exists())$('#live span').textContent='Dukaan ne abhi daam nahi bheje'},e=>{setLiveUI(false);$('#live span').textContent='Daam nahi aa pa rahe ('+((e&&e.code)||'error')+')'});
  }catch(e){setLiveUI(false)}
}
rebuild();render();setLiveUI(false);initFB();
})();
</script>
